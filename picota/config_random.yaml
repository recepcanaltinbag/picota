# -------------------------
# Logging
# -------------------------
logging:
  log_file: "/media/lin-bio/back2/picota_project_RandomSRA/picota.log"
  level: "INFO"
  logger_name: "picota_analysis"

# -------------------------
# Paths / General pipeline settings
# -------------------------
paths:
  # Pipeline
  outdir: "/media/lin-bio/back2/picota_project_RandomSRA"
  sra_id_file: "picota/RandomSRA.csv"
  fastq_dump: "parallel-fastq-dump"

  # Assembly
  assembly_threads: 24
  assembly_k_mer_list: "99"
  quiet: true
  keep_temp_files: false
  path_of_spades: "spades.py"
  path_of_fastp: "fastp"
  skip_filtering: true
  # SPAdes, not MEGAHIT. Measured on simulated genomes with known composite
  # transposons: PICOTA recovers 40/40 elements from the SPAdes assembly graph
  # and 19/40 from the MEGAHIT graph of the same reads. MEGAHIT simplifies
  # repeats harder, so the bubbles a composite transposon makes are not in its
  # graph to be found -- and a structure absent from the graph cannot be
  # recovered by any amount of scoring downstream.
  assembler_type: "spades"
  path_of_megahit: "megahit"

  # Tools
  gfa_tools_path: "./picota/tools/gfaview/misc/fastg2gfa"
  path_of_bandage: "./picota/tools/Bandage_Ubuntu-x86-64_v0.9.0_AppDir/Bandage_Ubuntu-x86-64_v0.9.0/usr/bin/bandage"

  # Databases
  path_to_antibiotics: "picota/DBs/Antibiotics/protein_fasta_protein_homolog_model.fasta"
  path_to_xenobiotics: "picota/DBs/Xenobiotics/Xenobiotics_classified.fasta"
  path_to_ises: "picota/DBs/ISes/tncentral_integrall_isfinder-TNs.fasta"
  path_to_TNs: "picota/DBs/CompTns/Known_Tns.fasta"


  # SRA
  find_all_path: true
  path_limit: 25

# -------------------------
# General options
# -------------------------
options:
  delete_fastq_files: true
  # 1000, not 2000. The graph cycle of a composite transposon is IS + cargo,
  # not IS + cargo + IS -- both flanking copies collapse into one node -- so a
  # compact element produces a cycle far shorter than itself. Measured on twelve
  # implanted elements of 2470-3095 bp, whose cycles run 1761-2280 bp: the old
  # threshold recovered 8 of 12, this one recovers all 12. The cost on a
  # wild-type genome with nothing implanted is 17 candidate cycles rising to 22.
  # IS26 at 820 bp with a single resistance gene sits in exactly this range.
  min_size_of_cycle: 1000
  max_size_of_cycle: 30000
  name_prefix_cycle: "Cycle"
  min_component_number: 1
  max_component_number: 25
  k_mer_sim: 80
  threshold_sim: 80
  # Deduplication of candidate cycles. 'legacy' is the historical behaviour.
  # 'strict' never discards a candidate for merely sharing a repeat node with an
  # accepted one -- see docs/ROADMAP.md phase 2.
  dedup_mode: "legacy"
  # Estimated nucleotide identity (%) above which two same-sized candidates count
  # as the same sequence. Used by dedup_mode "strict" only.
  dedup_min_ani: 99.0
  mapping_threads: 8
  split_min_score: 92


# new parameters
  mean_of_CompTns: 5850
  std_of_CompTns: 2586
  total_score_type: 0
  threshold_final_score: 50
  max_z: 20
  dist_type: 1
  path_of_prodigal: "prodigal"
  path_of_blastn: "blastn"
  path_of_makeblastdb: "makeblastdb"
  path_of_blastx: "blastx"
  path_of_blastp: "blastp"




# -------------------------
# Block patterns
# -------------------------
patterns:
  CT: ["cargo", "transposon"]
  TC: ["transposon", "cargo"]
  TCT: ["transposon", "cargo", "transposon"]
  CTC: ["cargo", "transposon", "cargo"]
  CTCT: ["cargo", "transposon", "cargo", "transposon"]
  TCTC: ["transposon", "cargo", "transposon", "cargo"]
  TCTCT: ["transposon", "cargo", "transposon", "cargo", "transposon"]
  CTCTC: ["cargo", "transposon", "cargo", "transposon", "cargo"]
  TCTCTC: ["transposon", "cargo", "transposon", "cargo", "transposon", "cargo"]
  TCTCTCT: ["transposon", "cargo", "transposon", "cargo", "transposon", "cargo", "transposon"]

# -------------------------
# Block tolerances
# -------------------------
tolerances:
  tolerance: 1000
  small_overlap: 300
  boosted_tolerance: 1000
  max_boost: 5000
  mode_gap_tolerance: 200
  min_large_fraction: 0.25
  absolute_small_gap: 200
  max_reasonable_gap: 10000  

# -------------------------
# Plotting config
# -------------------------
plotting:
  outdir: "figures"
  prefix: "global"
  hist_bins: 30
  scatter_point_size: 30
  scatter_alpha: 0.6
